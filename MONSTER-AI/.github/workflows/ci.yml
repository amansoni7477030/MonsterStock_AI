name: CI

# Lint + tests on every supported interpreter, shell script linting, and a guard that the pinned
# requirements keep installing from BINARY wheels on the production platforms (the 1 GB server never
# compiles anything).

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dashboard.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests with coverage gate
        run: pytest --cov --cov-fail-under=80

  shell:
    name: Shell and PowerShell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ShellCheck (pinned to the version the scripts were verified with)
        run: |
          python -m pip install shellcheck-py==0.11.0.1
          shellcheck --version
          shellcheck -x deployment/*.sh deployment/lib/*.sh

      - name: Syntax check (bash -n)
        run: |
          set -Eeuo pipefail
          for f in deployment/*.sh deployment/lib/*.sh; do bash -n "$f"; done

      - name: Shell, unit and config files must be LF-only
        run: |
          set -Eeuo pipefail
          bad=$(grep -rIl $'\r' deployment --include='*.sh' --include='*.service' --include='*.timer' --include='*.conf' --include='logrotate-monster' || true)
          if [ -n "$bad" ]; then
            echo "CRLF line endings found in:" >&2
            echo "$bad" >&2
            exit 1
          fi

      - name: PowerShell parses cleanly
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/deployment/deploy_remote.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error ("{0} (line {1})" -f $_.Message, $_.Extent.StartLineNumber) }
            exit 1
          }
          Write-Host 'deploy_remote.ps1: no parse errors'

  wheels:
    name: Binary wheels (Python ${{ matrix.python-version }}, ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: requirements.txt resolves to wheels for linux ${{ matrix.arch }}
        env:
          PY_VERSION: ${{ matrix.python-version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          abi="cp${PY_VERSION/./}"
          platforms=()
          for glibc in 2_35 2_34 2_31 2_28 2_27 2_24 2_17; do
            platforms+=(--platform "manylinux_${glibc}_${ARCH}")
          done
          platforms+=(--platform "manylinux2014_${ARCH}")
          common=(--python-version "$PY_VERSION" --implementation cp --abi "$abi" "${platforms[@]}")
          mkdir -p "$RUNNER_TEMP/wheels"

          # feedparser's only dependency, sgmllib3k, is a tiny pure-Python package that exists as an
          # sdist only. The installer builds exactly that one from source (--no-binary=sgmllib3k, no
          # compiler involved); everything else must be a wheel. So: every pin except feedparser is
          # resolved with --only-binary=:all: (dependencies included) ...
          grep -viE '^feedparser==' requirements.txt > "$RUNNER_TEMP/requirements-wheels.txt"
          python -m pip download --only-binary=:all: --dest "$RUNNER_TEMP/wheels" \
            -r "$RUNNER_TEMP/requirements-wheels.txt" "${common[@]}"

          # ... feedparser itself must be a wheel, and the sgmllib3k sdist must contain no C sources.
          python -m pip download --only-binary=:all: --no-deps --dest "$RUNNER_TEMP/wheels" \
            "$(grep -iE '^feedparser==' requirements.txt)" "${common[@]}"
          python -m pip download --no-binary=:all: --no-deps --dest "$RUNNER_TEMP/sdist" sgmllib3k
          if tar -tzf "$RUNNER_TEMP"/sdist/sgmllib3k-*.tar.gz | grep -E '\.(c|cc|cpp|cxx|h|pyx)$'; then
            echo "sgmllib3k now ships compiled sources: the 1 GB server cannot build it" >&2
            exit 1
          fi
          ls -1 "$RUNNER_TEMP/wheels"
