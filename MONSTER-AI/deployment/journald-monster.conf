# MONSTER AI - journald drop-in (installed as /etc/systemd/journald.conf.d/monster-ai.conf)
#
# Keeps the journal small on the 8 GB / 1 GB-RAM production server. The application also writes its own
# daily log files to /var/log/monster-ai (bounded by LOG_RETENTION_DAYS / LOG_MAX_MB), so the journal is only
# the short-term, always-available copy (service start/stop events, crash tracebacks, the text sent by the
# OnFailure alert).
#
#   SystemMaxUse    - upper bound for the persistent journal in /var/log/journal
#   RuntimeMaxUse   - upper bound for the volatile journal in /run/log/journal (RAM-backed)
#   MaxRetentionSec - entries older than two weeks are dropped even if the size cap is not reached
#
# The size caps are system-wide on purpose: one shared journal, one disk budget.
[Journal]
SystemMaxUse=100M
RuntimeMaxUse=50M
MaxRetentionSec=2week
